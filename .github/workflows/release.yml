name: Release DParams packages
'on':
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate release tag matches pyproject.toml version
        run: python3 scripts/validate_release_tag.py "${GITHUB_REF_NAME}"
  native:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: ""
          - os: macos-15
            name: macos-aarch64
            target: ""
          - os: macos-15
            name: macos-x86_64
            target: "x86_64-apple-darwin"
          - os: windows-latest
            name: windows-x86_64
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - name: Build datum-params CLI and library
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --locked --release --manifest-path rust/Cargo.toml --bin datum-params --lib --target "${{ matrix.target }}"
          else
            cargo build --locked --release --manifest-path rust/Cargo.toml --bin datum-params --lib
          fi
      - name: Package CLI and C++ library
        shell: bash
        run: |
          mkdir -p dist/dparams/include
          cp rust/include/dparams_lazy.h dist/dparams/include/
          cp LICENSE dist/dparams/
          if [ -n "${{ matrix.target }}" ]; then
            target_bin_dir="rust/target/${{ matrix.target }}/release"
          else
            target_bin_dir="rust/target/release"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "$target_bin_dir/datum-params.exe" dist/dparams/
            cp "$target_bin_dir/datum_params_tools.lib" dist/dparams/
          else
            cp "$target_bin_dir/datum-params" dist/dparams/
            cp "$target_bin_dir/libdatum_params_tools.a" dist/dparams/
          fi
          cp -R examples/cpp-pick-place dist/dparams/example
          python -c 'import pathlib,zipfile; root=pathlib.Path("dist/dparams"); z=zipfile.ZipFile("dist/datum-params-${{ matrix.name }}.zip","w",zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root.parent)) for p in root.rglob("*") if p.is_file()]; z.close()'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
  github-release:
    needs: [validate-tag, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          fail_on_unmatched_files: true
  publish-python:
    needs: [validate-tag, native, github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pip build
      - run: python -m build datum_interface
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: datum_interface/dist/
          skip-existing: true
