name: Release DParams packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-14
            name: macos-aarch64
          - os: macos-13
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --manifest-path rust/Cargo.toml --bin datum-params --lib
      - name: Package CLI and C++ library
        shell: bash
        run: |
          mkdir -p dist/dparams/include
          cp rust/include/dparams_lazy.h dist/dparams/include/
          cp LICENSE dist/dparams/
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp rust/target/release/datum-params.exe dist/dparams/
            cp rust/target/release/datum_params_tools.lib dist/dparams/
          else
            cp rust/target/release/datum-params dist/dparams/
            cp rust/target/release/libdatum_params_tools.a dist/dparams/
          fi
          cp -R examples/cpp-pick-place dist/dparams/example
          python -c 'import pathlib,zipfile; root=pathlib.Path("dist/dparams"); z=zipfile.ZipFile("dist/datum-params-${{ matrix.name }}.zip","w",zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root.parent)) for p in root.rglob("*") if p.is_file()]; z.close()'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
  publish-python:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install build
      - run: python -m build datum_interface
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: datum_interface/dist/
  github-release:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
