name: Release DParams packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate release tag matches pyproject.toml version
        run: |
          python -c "
import pathlib, sys

tag = sys.argv[1]
toml_path = pathlib.Path('datum_interface/pyproject.toml')
if not toml_path.is_file():
    sys.exit('Error: datum_interface/pyproject.toml not found')

version = None
try:
    import tomllib
    with open(toml_path, 'rb') as f:
        version = tomllib.load(f).get('project', {}).get('version')
except Exception:
    pass

if not version:
    for line in toml_path.read_text(encoding='utf-8').splitlines():
        line = line.strip()
        if line.startswith('version'):
            parts = line.split('=', 1)
            if len(parts) == 2:
                version = parts[1].strip().strip('\"\'')
                break

if not version:
    sys.exit('Error: Could not determine version from datum_interface/pyproject.toml')

expected_tag = f'v{version}'
if tag != expected_tag and tag != version:
    sys.exit(
        f'Release tag mismatch: got tag {tag!r}, but datum_interface/pyproject.toml specifies version {version!r} '
        f'(expected {expected_tag!r}). Tag must match the package version before any publishing.'
    )

print(f'Validated release tag {tag!r} matches datum_interface/pyproject.toml version {version!r}')
" "${GITHUB_REF_NAME}"
  native:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-15
            name: macos-aarch64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --manifest-path rust/Cargo.toml --bin datum-params --lib
      - name: Package CLI and C++ library
        shell: bash
        run: |
          mkdir -p dist/dparams/include
          cp rust/include/dparams_lazy.h dist/dparams/include/
          cp LICENSE dist/dparams/
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp rust/target/release/datum-params.exe dist/dparams/
            cp rust/target/release/datum_params_tools.lib dist/dparams/
          else
            cp rust/target/release/datum-params dist/dparams/
            cp rust/target/release/libdatum_params_tools.a dist/dparams/
          fi
          cp -R examples/cpp-pick-place dist/dparams/example
          python -c 'import pathlib,zipfile; root=pathlib.Path("dist/dparams"); z=zipfile.ZipFile("dist/datum-params-${{ matrix.name }}.zip","w",zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root.parent)) for p in root.rglob("*") if p.is_file()]; z.close()'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
  github-release:
    needs: [validate-tag, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          fail_on_unmatched_files: true
  publish-python:
    needs: [validate-tag, native, github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pip build
      - run: python -m build datum_interface
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: datum_interface/dist/
          skip-existing: true
