[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datum-cad-parameters"
version = "0.1.0"
license = {text = "Apache-2.0"}
description = "Runtime interface for Datum CAD-derived parameter manifests"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
